name: Build & Test APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # QuickJS-NG (JS 엔진)를 정적 바이너리로 빌드 → 앱에 libqjs.so 로 포함
      - name: Build QuickJS (static, zig)
        shell: bash
        run: |
          set -o pipefail
          {
            pip install ziglang
            Z="$(python3 -c 'import ziglang,os;print(os.path.dirname(ziglang.__file__))')/zig"
            git clone --depth 1 https://github.com/quickjs-ng/quickjs.git /tmp/qjs
            mkdir -p /tmp/zigbin
            for T in aarch64:arm64-v8a x86_64:x86_64; do
              ARCH=${T%%:*}; ABI=${T##*:}
              printf '#!/bin/sh\nexec %s cc -target %s-linux-musl "$@"\n' "$Z" "$ARCH" > /tmp/zigbin/cc-$ARCH
              chmod +x /tmp/zigbin/cc-$ARCH
              cmake -S /tmp/qjs -B /tmp/qjs-$ARCH -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER=/tmp/zigbin/cc-$ARCH -DCMAKE_SYSTEM_NAME=Linux \
                -DCMAKE_SYSTEM_PROCESSOR=$ARCH -DCMAKE_EXE_LINKER_FLAGS=-static
              cmake --build /tmp/qjs-$ARCH --target qjs -j4
              mkdir -p app/src/main/jniLibs/$ABI
              cp /tmp/qjs-$ARCH/qjs app/src/main/jniLibs/$ABI/libqjs.so
              file app/src/main/jniLibs/$ABI/libqjs.so
            done
            app/src/main/jniLibs/x86_64/libqjs.so -e 'console.log("qjs ok", 1+2)'
          } 2>&1 | tee qjs-build.txt | tail -40

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 에뮬레이터에서 샘플 영상 실제 다운로드 테스트
      - name: Download test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb logcat -c
            gradle connectedDebugAndroidTest -Pemu=true --no-daemon > gradle-test.txt 2>&1 || touch test-failed
            adb logcat -d -s VideoDLTest:* > test-log.txt || true

      - name: Collect test log
        if: always()
        run: |
          { echo "=== logcat ==="; cat test-log.txt 2>/dev/null; echo; echo "=== gradle (tail) ==="; tail -60 gradle-test.txt 2>/dev/null; echo "=== qjs build (tail) ==="; tail -40 qjs-build.txt 2>/dev/null; } > VideoDL-test-log.txt
          [ -f test-failed ] && echo "RESULT: FAILED" >> VideoDL-test-log.txt || echo "RESULT: PASSED" >> VideoDL-test-log.txt
          tail -5 VideoDL-test-log.txt

      - name: Publish test log
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-log
          name: Latest test log
          prerelease: true
          files: VideoDL-test-log.txt

      - name: Fail if test failed
        run: '[ ! -f test-failed ]'

      # 테스트 통과했을 때만 폰용 APK 빌드/배포
      - name: Build phone APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk VideoDL.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VideoDL build ${{ github.run_number }} (테스트 통과)
          make_latest: true
          files: VideoDL.apk
